name: Build OC Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev build-essential python3 zip unzip wget rsync

      - name: Apply OC patch
        run: git apply oc_helio_g70_v2_g75.patch

      - name: Build kernel
        run: |
          chmod +x build.sh
          export LD_LIBRARY_PATH="${PWD}/clang/lib64:${LD_LIBRARY_PATH}"
          ./build.sh

      - name: Publish as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: oc-build-${{ github.run_number }}
          files: AnyKernel/*.zip
